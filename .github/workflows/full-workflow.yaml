---
name: Build and Push a Docker Image and a Python Package
on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: acemagic-s1-led-tft-linux
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Build python package
        run: |
          python --version ; pip --version  # For debugging
          pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          python -m pip install --upgrade pip twine build pytest httpx pytest-asyncio
          python -m build
      - name: Test python package
        run: |
          python --version ; pip --version  # For debugging
          source venv/bin/activate
          python -m pip install -e .
          pytest tests
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:rc-release
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
