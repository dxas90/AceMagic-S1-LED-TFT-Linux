[package]
name = "acemagic-s1"
version = "0.1.0"
edition = "2021"
description = "AceMagic S1 LCD/LED panel controller — single binary Rust port of s1panel"

[[bin]]
name = "acemagic-s1"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Hardware I/O
hidapi = "2"
serialport = "4"

# 2D Rendering (pure Rust, no libcairo)
tiny-skia = "0.11"
fontdue = "0.9"
resvg = "0.42"
usvg = "0.42"

# Image I/O
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Config / Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
tempfile = "3"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
